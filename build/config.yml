# This file contains the configuration for this project, read by `wails3 dev`.
# The build assets (build/darwin/Info.plist, build/windows/info.json and
# wails.exe.manifest) are kept by hand with the values Marasi has always
# shipped, above all the bundle identifier com.wails.marasi-app. Don't run
# `wails3 update build-assets`: it would overwrite them from `info` below.
version: '3'

info:
  companyName: "marasi-app" # The name of the company
  productName: "marasi-app" # The name of the application
  productIdentifier: "com.wails.marasi-app" # The unique product identifier
  description: "marasi-app" # The application description
  copyright: "Copyright........." # Copyright text
  comments: "Built using Wails (https://wails.io)" # Comments
  version: "1.0.0" # The application version
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"


# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
      # The standard frontend task waits up to 60s for HTTP 200 from
      # FRONTEND_DEVSERVER_URL before starting the app. Override if needed;
      # custom background commands can opt in with the same readiness block.
      # readiness:
      #   http: "http://localhost:5173/"
      #   timeout: "60s"
      #   interval: "200ms"
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
