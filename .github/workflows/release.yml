name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]'
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]-*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          git fetch origin "$default_branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on ${default_branch}"
            exit 1
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      channel: release
      version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum marasi-app marasi-app.exe marasi-app.app.zip > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(dist/marasi-app dist/marasi-app.exe dist/marasi-app.app.zip dist/checksums.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --latest \
              "${assets[@]}"
          fi
