name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]'
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]-*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          git fetch origin "$default_branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on ${default_branch}"
            exit 1
          fi

  # Each build carries its platform's Marasi CLI, the latest CLI release on
  # this channel, verified (build.yml, "Carry the Marasi CLI").
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      channel: release
      version: ${{ github.ref_name }}
    secrets: inherit

  # The iOS app of the same commit, to TestFlight. It doesn't hold up the
  # desktop release, and a failure leaves the release as it is.
  testflight:
    needs: prepare
    uses: ./.github/workflows/testflight.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ github.ref_name }}
    secrets: inherit

  # The Android app of the same commit, to a Google Play testing track
  # (PLAY_RELEASE_TRACK; internal until it is set). Like testflight, it
  # doesn't hold up the desktop release.
  play:
    needs: prepare
    uses: ./.github/workflows/play.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ github.ref_name }}
      track: ${{ vars.PLAY_RELEASE_TRACK || 'internal' }}
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The release notes open with the system requirements.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum marasi-app marasi-app.exe marasi-app.app.zip > checksums.txt
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Sign checksums
        working-directory: dist
        env:
          SIGNING_KEY: ${{ secrets.MARASI_SIGNING_KEY }}
          SIGNING_PUBLIC_KEY: ${{ vars.MARASI_SIGNING_PUBLIC_KEY }}
          CHANNEL: release
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::repository secret MARASI_SIGNING_KEY is not set"
            exit 1
          fi
          if [ -z "$SIGNING_PUBLIC_KEY" ]; then
            echo "::error::repository variable MARASI_SIGNING_PUBLIC_KEY is not set"
            exit 1
          fi
          go install aead.dev/minisign/cmd/minisign@v0.3.0
          key_file="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key_file")
          "$(go env GOPATH)/bin/minisign" -S -s "$key_file" -m checksums.txt \
            -t "marasi-app $CHANNEL $VERSION"
          # Fails the job if the secret and the key built into the app differ.
          "$(go env GOPATH)/bin/minisign" -V -H -P "$SIGNING_PUBLIC_KEY" -m checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(dist/marasi-app dist/marasi-app.exe dist/marasi-app.app.zip dist/checksums.txt dist/checksums.txt.minisig)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --notes-file .github/release-requirements.txt \
              --generate-notes \
              --latest \
              "${assets[@]}"
          fi
