# Builds the iOS app and uploads it to TestFlight. release.yml runs it for
# each release tag and nightly.yml for each nightly; run it by hand from
# Actions → TestFlight → Run workflow.
# App Store Connect then processes the build (5–30 minutes) and offers it to
# the internal testers; submitting a build for App Store review stays a
# manual step in App Store Connect.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (DD.MM.YYYY); empty for today"
        required: false
        default: ""
      channel:
        description: "release or nightly"
        required: false
        type: choice
        options: [release, nightly]
        default: release
      marasi_ref:
        description: "marasi commit to build against; empty for go.mod's"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Commit to build"
        required: true
        type: string
      version:
        description: "Version (DD.MM.YYYY, the release tag, or a nightly's)"
        required: true
        type: string
      channel:
        description: "release or nightly"
        required: false
        type: string
        default: release
      marasi_ref:
        description: "marasi commit to build against (nightly); empty for go.mod's"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  testflight:
    concurrency:
      group: testflight
      cancel-in-progress: false
    # Xcode 27 (preview image): the regular macOS runners stop at Xcode
    # 26.6 (iOS 26.5 SDK), and iOS runs an app built with an older SDK in
    # compatibility mode on newer screens, such as the iPhone Duo unfolded.
    runs-on: xcode-27
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: iOS SDK 27 or later
        run: |
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Xcode $(xcodebuild -version | head -1 | awk '{print $2}'), iOS SDK $sdk"
          if [ "${sdk%%.*}" -lt 27 ]; then
            echo "::error::iOS SDK $sdk is older than 27: the app would run in compatibility mode on the iPhone Duo"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - if: inputs.marasi_ref != ''
        env:
          MARASI_REF: ${{ inputs.marasi_ref }}
        run: go get "github.com/tfkr-ae/marasi@$MARASI_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Wails and asc
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          brew install asc
      # main.go embeds frontend/build, which binding generation needs before
      # the frontend build fills it.
      - run: mkdir -p frontend/build && touch frontend/build/.keep
      # The CI's own Apple Distribution certificate and its App Store
      # profile ("Marasi App Store CI"), from repository secrets.
      - uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERT }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          keychain-password: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
      - name: Signing files
        env:
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/signing/appstore.mobileprovision"
          build/ios/scripts/appstore-entitlements.sh "$RUNNER_TEMP/signing/appstore.mobileprovision" "$RUNNER_TEMP/signing/appstore.entitlements"
      - name: Build
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel || 'release' }}
        run: |
          # build/ios/scripts/store-version.sh turns DD.MM.YYYY into the
          # App Store's YYYY.M.D.
          VERSION=${VERSION:-$(date -u '+%d.%m.%Y')}
          identity=$(security find-identity -v -p codesigning | awk '/Apple Distribution/ { print $2; exit }')
          wails3 task ios:package:ipa \
            IOS_PLATFORM=device \
            CODESIGN_IDENTITY="$identity" \
            PROVISIONING_PROFILE="$RUNNER_TEMP/signing/appstore.mobileprovision" \
            ENTITLEMENTS_FILE="$RUNNER_TEMP/signing/appstore.entitlements" \
            CHANNEL="$CHANNEL" VERSION="$VERSION"
          codesign --verify --strict --verbose=2 bin/marasi-app.app
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: asc builds upload --app "$ASC_APP_ID" --ipa bin/marasi-app.ipa --wait
