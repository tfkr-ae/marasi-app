name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      channel:
        description: Build channel embedded in the app (nightly or release)
        required: true
        type: string
      version:
        description: Version string embedded in the app, in the marasi CLI format
        required: true
        type: string
      marasi_ref:
        description: marasi commit to build against instead of the go.mod version (nightlies only)
        required: false
        type: string
        default: ''
  # A test build: builds, signs and notarizes like a nightly or release, but
  # publishes nothing. The assets are this run's workflow artifacts.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to build (defaults to the branch selected above)
        required: false
        type: string
      channel:
        description: Build channel embedded in the app
        required: true
        type: choice
        options:
          - nightly
          - release
        default: nightly
      version:
        description: Version string embedded in the app (defaults to today's date, plus "(nightly <commit>)" on the nightly channel)
        required: false
        type: string
      marasi_ref:
        description: marasi commit to build against instead of the go.mod version
        required: false
        type: string
        default: ''

# Building needs no write access, so a manual run cannot publish or change a
# release, tag or nightly. The callers publish in their own jobs.
permissions:
  contents: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - if: inputs.marasi_ref != ''
        env:
          MARASI_REF: ${{ inputs.marasi_ref }}
        run: go get "github.com/tfkr-ae/marasi@$MARASI_REF"
      - run: sudo apt-get -yq update && sudo apt-get -yq install libgtk-4-dev libwebkitgtk-6.0-dev
      # main.go embeds frontend/build, which only exists after a frontend build.
      - run: mkdir -p frontend/build && touch frontend/build/.keep
      - run: go test -v -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # task is the wails3 Taskfile task that builds the platform into
          # bin/; asset is the release asset's name in bin/, which each
          # defaultInstaller downloads. A tags entry passes extra build tags.
          # cli is the platform of the Marasi CLI the build carries; the
          # universal macOS build carries the arm64 CLI in its arm64 half
          # only, since Marasi publishes no darwin/amd64 CLI.
          - os: ubuntu-24.04
            task: linux:build
            asset: marasi-app
            cli: linux/amd64
          - os: windows-latest
            task: windows:build
            asset: marasi-app.exe
            cli: windows/amd64
          - os: macos-latest
            task: darwin:package:universal
            asset: marasi-app.app.zip
            cli: darwin/arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - if: inputs.marasi_ref != ''
        env:
          MARASI_REF: ${{ inputs.marasi_ref }}
        run: go get "github.com/tfkr-ae/marasi@$MARASI_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: runner.os == 'Linux'
        run: sudo apt-get -yq update && sudo apt-get -yq install libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      # main.go embeds frontend/build, which binding generation needs before
      # the frontend build fills it.
      - run: mkdir -p frontend/build && touch frontend/build/.keep
      # Release and nightly builds carry their platform's Marasi CLI, gzipped
      # (docs/adr/2026-11-08-the-app-carries-a-compressed-cli-it-installs-once.md):
      # the latest CLI release on the app's channel, verified against the
      # signing key and trusted comment the app uses, and its SHA-256. Any
      # failure fails the build. The carried_cli tag embeds carried_cli/.
      - name: Carry the Marasi CLI
        env:
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ matrix.cli }}
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/carry-cli -channel "$CHANNEL" -platform "$PLATFORM" -out carried_cli
      - name: Build
        env:
          TASK: ${{ matrix.task }}
          TAGS: carried_cli${{ matrix.tags && format(',{0}', matrix.tags) || '' }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          # The public half of the Marasi signing key (docs/adr/2026-10-17-updates-are-signed-with-an-embedded-key.md), the base64
          # line of minisign.pub. The app verifies updates against it.
          SIGNING_PUBLIC_KEY: ${{ vars.MARASI_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$SIGNING_PUBLIC_KEY" ]; then
            echo "::error::repository variable MARASI_SIGNING_PUBLIC_KEY is not set"
            exit 1
          fi
          # Only a manual run leaves the version empty.
          if [ -z "$VERSION" ]; then
            VERSION=$(date -u '+%d.%m.%Y')
            if [ "$CHANNEL" = nightly ]; then
              VERSION="$VERSION (nightly $(git rev-parse --short=7 HEAD))"
            fi
          fi
          # The platform Taskfiles read CHANNEL, VERSION and
          # SIGNING_PUBLIC_KEY from the environment into -X ldflags.
          args=("$TASK" "EXTRA_TAGS=$TAGS")
          wails3 task "${args[@]}"
      - if: runner.os == 'macOS'
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_DEVELOPER_CERT }}
          p12-password: ${{ secrets.MACOS_DEVELOPER_CERT_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_DEVELOPER_CERT_PASSWORD }}
      - name: Sign and notarize
        if: runner.os == 'macOS'
        env:
          MACOS_DEVELOPER_CERT_ID: ${{ secrets.MACOS_DEVELOPER_CERT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          app=bin/marasi-app.app
          zip_path=bin/marasi-app.app.zip
          codesign --force --options runtime --timestamp --deep --sign "$MACOS_DEVELOPER_CERT_ID" "$app"
          codesign --verify --deep --strict --verbose "$app"
          team_id="${MACOS_DEVELOPER_CERT_ID##*(}"
          team_id="${team_id%)}"
          ditto -c -k --keepParent "$app" "$zip_path"
          keychain="$HOME/Library/Keychains/signing_temp.keychain-db"
          xcrun notarytool store-credentials marasi-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$team_id" \
            --keychain "$keychain"
          xcrun notarytool submit "$zip_path" \
            --keychain-profile marasi-notary \
            --keychain "$keychain" \
            --wait
          xcrun stapler staple "$app"
          rm -f "$zip_path"
          ditto -c -k --keepParent "$app" "$zip_path"
      - if: runner.os == 'Linux'
        run: chmod +x bin/marasi-app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: bin/${{ matrix.asset }}
