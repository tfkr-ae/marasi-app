name: Build

# Builds v2's Electron app for macOS, Windows and Linux, each with the
# bundled Marasi that package.json's "marasi" pin names. The build's channel,
# version and the public signing key go into package.json's marasiBuild,
# which the app reads as its build identity (electron/buildInfo.js).

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      channel:
        description: Build channel embedded in the app (v2-nightly)
        required: true
        type: string
      version:
        description: Version string embedded in the app, "DD.MM.YYYY (v2-nightly <commit>)"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # Installs both package trees and builds the bundled Marasi, so the
      # integration suites run against it.
      - run: sh scripts/bootstrap.sh
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            dist: dist:linux
            assets: marasi-v2-linux.AppImage marasi-v2-linux.deb
          - os: windows-latest
            dist: dist:win
            assets: marasi-v2-windows.exe
          - os: macos-latest
            dist: dist:mac
            assets: marasi-v2-mac.zip marasi-v2-mac.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: npm ci && npm --prefix frontend ci
      - name: Build identity
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          # The public half of the Marasi signing key (docs/adr/2026-10-17-updates-are-signed-with-an-embedded-key.md),
          # the base64 line of minisign.pub. The app verifies updates against it.
          SIGNING_PUBLIC_KEY: ${{ vars.MARASI_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$SIGNING_PUBLIC_KEY" ]; then
            echo "::error::repository variable MARASI_SIGNING_PUBLIC_KEY is not set"
            exit 1
          fi
          npm pkg set "marasiBuild.channel=$CHANNEL" "marasiBuild.version=$VERSION" \
            "marasiBuild.signingPublicKey=$SIGNING_PUBLIC_KEY"
      # npm runs scripts with cmd.exe on Windows, which can't read the
      # `GOOS=windows npm run marasi` prefix in dist:win, so run them with
      # the runner's Git Bash there.
      - name: Build
        if: runner.os != 'macOS'
        env:
          DIST: ${{ matrix.dist }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm config set script-shell "$(cygpath -w "$(command -v bash)")"
          fi
          npm run "$DIST"
      # electron-builder signs the app with the Developer ID certificate v1
      # signs with, notarizes and staples it, then makes the zip and dmg.
      - name: Build, sign and notarize
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MACOS_DEVELOPER_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_DEVELOPER_CERT_PASSWORD }}
          MACOS_DEVELOPER_CERT_ID: ${{ secrets.MACOS_DEVELOPER_CERT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          team_id="${MACOS_DEVELOPER_CERT_ID##*(}"
          export APPLE_TEAM_ID="${team_id%)}"
          identity="${MACOS_DEVELOPER_CERT_ID#Developer ID Application: }"
          npm run dist:mac -- -c.mac.identity="$identity" -c.mac.notarize=true
          app="dist/mac-universal/Marasi v2.app"
          codesign --verify --deep --strict --verbose "$app"
          xcrun stapler validate "$app"
      - name: Collect
        env:
          ASSETS: ${{ matrix.assets }}
        run: |
          mkdir -p out
          for asset in $ASSETS; do mv "dist/$asset" out/; done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: out/*
